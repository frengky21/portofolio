<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />   
    <meta http-equiv="pragma" content="no-cache">
    <meta http-equiv="expires" content="-1">
    <title>Warung Bu Rizky - Log out</title>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            /* GRADASI KREM YANG ANDA SUKAI */
            background: linear-gradient(135deg, #fdfbf7 0%, #f5e6d3 50%, #e8d5c4 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .ie-fixMinHeight {
            width: 100%;
            display: flex;
            justify-content: center;
        }

        .main {
            width: 100%;
            max-width: 500px;
        }

        .wrap {
            background: rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 40px 32px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.4);
            text-align: center;
        }

        .brand-header {
            margin-bottom: 20px;
        }

        .brand-name {
            color: #2d3a4a;
            font-size: 22px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .brand-sub {
            color: #4a5a6a;
            font-size: 13px;
            font-weight: 400;
            margin-top: 2px;
        }

        h1 {
            color: #2d3a4a;
            font-size: 22px;
            margin-bottom: 20px;
            font-weight: 700;
        }

        table {
            width: 100%;
            margin: 20px 0 30px 0;
            border-collapse: collapse;
            color: #334155;
            font-size: 14px;
            text-align: left;
        }

        table tr {
            border-bottom: 1px solid rgba(255, 255, 255, 0.4);
        }

        table tr:last-child {
            border-bottom: none;
        }

        table td {
            padding: 10px 8px;
            vertical-align: middle;
        }

        table td:first-child {
            font-weight: 600;
            color: #2d3a4a;
            width: 45%;
        }

        table td:last-child {
            text-align: right;
            word-break: break-all;
        }

        form {
            margin-top: 8px;
        }

        input[type="submit"] {
            width: 100%;
            padding: 14px 24px;
            background: #2d3a4a;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            letter-spacing: 0.5px;
        }

        input[type="submit"]:hover {
            background: #1a2633;
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.15);
        }

        input[type="submit"]:active {
            transform: translateY(0);
        }

        /* Responsif */
        @media (max-width: 480px) {
            .wrap {
                padding: 24px 16px;
            }
            table td {
                padding: 8px 4px;
                font-size: 13px;
            }
            h1 {
                font-size: 18px;
            }
            .brand-name {
                font-size: 18px;
            }
        }
    </style>

    <script>
        function openLogin() {
            if (window.name != 'hotspot_logout') return true;
            open('$(link-login)', '_blank', '');
            window.close();
            return false;
        }
    </script>
</head>

<body>
    <div class="ie-fixMinHeight">
        <div class="main">
            <div class="wrap">
                <!-- NAMA USAHA DI BAGIAN ATAS -->
                <div class="brand-header">
                    <div class="brand-name">Warung Bu Rizky</div>
                    <div class="brand-sub">Hotspot Internet</div>
                </div>

                <h1>You have just logged out!</h1> 
                <table>  
                    <tr><td>Username</td><td>$(username)</td></tr>
                    <tr><td>IP address</td><td>$(ip)</td></tr>
                    <tr><td>MAC address</td><td>$(mac)</td></tr>
                    <tr><td>Session time</td><td>$(uptime)</td></tr>
                    $(if session-time-left)
                    <tr><td>Time left</td><td>$(session-time-left)</td></tr>
                    $(endif)
                    <tr><td>Bytes up / down:</td><td>$(bytes-in-nice) / $(bytes-out-nice)</td></tr>
                </table>

                <form action="$(link-login)" name="login" onSubmit="return openLogin()">
                    <input type="submit" value="Log in">
                </form>
            </div>
        </div>
    </div>
</body>
</html>
