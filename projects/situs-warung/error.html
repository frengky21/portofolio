<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="pragma" content="no-cache">
    <meta http-equiv="expires" content="-1">
    <title>Internet hotspot - Error</title>
    
    <!-- Ganti CSS eksternal dengan internal untuk gradasi kuning -->
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            /* GRADASI KUNING */
            background: linear-gradient(135deg, #fef9c3 0%, #fde047 50%, #facc15 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .ie-fixMinHeight {
            width: 100%;
            display: flex;
            justify-content: center;
        }

        .main {
            width: 100%;
            max-width: 500px;
        }

        .wrap {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 40px 32px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.3);
            text-align: center;
        }

        h1 {
            color: #1e293b;
            font-size: 24px;
            margin-bottom: 16px;
            font-weight: 700;
            word-break: break-word;
        }

        .info {
            color: #334155;
            font-size: 15px;
            line-height: 1.6;
        }

        a {
            color: #1e3a8a;
            text-decoration: underline;
            font-weight: 500;
        }

        a:hover {
            color: #172554;
        }

        /* Responsif untuk layar kecil */
        @media (max-width: 480px) {
            .wrap {
                padding: 24px 16px;
            }
            h1 {
                font-size: 20px;
            }
            .info {
                font-size: 14px;
            }
        }
    </style>
</head>

<body>
    <div class="ie-fixMinHeight">
        <div class="main">
            <div class="wrap">
                <h1>Hotspot error: $(error)</h1>
                <p class="info">Log in page: <a href="$(link-login)">$(link-login)</a></p>
            </div>
        </div>
    </div>
</body>

</html>
