<!doctype html>
<html lang="en">

<head>
    <meta http-equiv="refresh" content="2; url=$(link-orig)">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />   
    <meta http-equiv="pragma" content="no-cache">
    <meta http-equiv="expires" content="-1">
    <title>Warung Bu Rizky - Advertisement</title>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            /* GRADASI KREM YANG ANDA SUKAI */
            background: linear-gradient(135deg, #fdfbf7 0%, #f5e6d3 50%, #e8d5c4 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .ie-fixMinHeight {
            width: 100%;
            display: flex;
            justify-content: center;
        }

        .main {
            width: 100%;
            max-width: 500px;
        }

        .wrap {
            background: rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 40px 32px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.4);
            text-align: center;
        }

        .brand-header {
            margin-bottom: 20px;
        }

        .brand-name {
            color: #2d3a4a;
            font-size: 22px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .brand-sub {
            color: #4a5a6a;
            font-size: 13px;
            font-weight: 400;
            margin-top: 2px;
        }

        h1 {
            color: #2d3a4a;
            font-size: 22px;
            margin-bottom: 16px;
            font-weight: 700;
        }

        .info {
            color: #334155;
            font-size: 15px;
            line-height: 1.6;
        }

        a {
            color: #2d3a4a;
            text-decoration: underline;
            font-weight: 500;
        }

        a:hover {
            color: #1a2633;
        }

        /* Responsif untuk layar kecil */
        @media (max-width: 480px) {
            .wrap {
                padding: 24px 16px;
            }
            h1 {
                font-size: 18px;
            }
            .brand-name {
                font-size: 18px;
            }
            .info {
                font-size: 14px;
            }
        }
    </style>

    <script>
        var popup = '';
        function openOrig() {
            if (window.focus) popup.focus();
            location.href = unescape('$(link-orig-esc)');
        }
        function openAd() {
            location.href = unescape('$(link-redirect-esc)');
        }
        function openAdvert() {
            if (window.name != 'hotspot_advert') {
                popup = open('$(link-redirect)', 'hotspot_advert', '');
                setTimeout("openOrig()", 1000);
                return;
            }
            setTimeout("openAd()", 1000);
        }
    </script>
</head>

<body onLoad="openAdvert()">
    <div class="ie-fixMinHeight">
        <div class="main">
            <div class="wrap">
                <!-- NAMA USAHA DI BAGIAN ATAS -->
                <div class="brand-header">
                    <div class="brand-name">Warung Bu Rizky</div>
                    <div class="brand-sub">Hotspot Internet</div>
                </div>

                <h1>Advertisement</h1>
                <p class="info">If nothing happens, open <a href="$(link-redirect)" target="hotspot_advert">advertisement</a> manually.</p>
            </div>
        </div>
    </div>
</body>
</html>
